<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELC Clicker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#090909;color:white;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;}
.container{width:420px;max-width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px;padding-bottom:20px;overflow-y:auto;box-sizing:border-box;}
.account{font-size:16px;opacity:.9;margin-top:5px;display:flex;gap:10px;align-items:center;}
.logout-btn{background:#333;padding:4px 8px;border-radius:8px;font-size:12px;cursor:pointer;}
.logout-btn:hover{background:#444;}
.balance{font-size:56px;font-weight:bold;margin-top:15px;}
.currency{font-size:18px;opacity:.8;margin-bottom:20px;}
.coin-area{flex:1;display:flex;justify-content:center;align-items:center;width:100%;min-height:250px;}
.coin{width:280px;height:280px;border-radius:50%;position:relative;cursor:pointer;transition:transform .08s ease;user-select:none;background:radial-gradient(circle at 30% 25%,#fff7a0 0%,#ffe04a 20%,#ffc107 55%,#db8d00 100%);box-shadow:0 0 60px rgba(255,215,0,.9),0 0 120px rgba(255,215,0,.5);}
.coin::before{content:"E";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:900;color:rgba(0,0,0,.3);}
.coin::after{content:"";position:absolute;left:20px;top:20px;width:75%;height:75%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);}
.coin.gold{background:radial-gradient(circle at 30% 30%,#fff6a0,#ffd400 40%,#ffb100 70%,#cc8600);box-shadow:0 0 70px #ffd400,0 0 120px rgba(255,212,0,.7);}
.coin.silver{background:radial-gradient(circle at 30% 30%,#ffffff,#d8d8d8 40%,#b8b8b8 70%,#888);box-shadow:0 0 70px #cfcfcf,0 0 120px rgba(220,220,220,.8);}
.coin.black{background:radial-gradient(circle at 30% 30%,#555,#111 50%,#000 80%);box-shadow:0 0 70px white,0 0 120px rgba(255,255,255,.8);}
.floating{position:absolute;font-size:28px;font-weight:bold;pointer-events:none;animation:float 1s forwards;}
@keyframes float{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-80px);}}
.bottom{width:100%;padding:10px;display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;border-radius:16px;margin-top:10px;margin-bottom:10px;}
.energy{font-size:20px;}
.buttons{display:flex;gap:10px;}
button{background:#333;color:white;border:none;padding:10px 15px;border-radius:10px;cursor:pointer;}
button:hover{background:#444;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;z-index:1000;}
.modal-content{background:#181818;width:350px;max-height:80vh;overflow:auto;padding:20px;border-radius:20px;}
.item{padding:12px;background:#252525;margin:10px 0;border-radius:12px;cursor:pointer;}
.item:hover{background:#333;}
.discord-btn{background:#5865F2;padding:12px 24px;border-radius:28px;font-weight:bold;cursor:pointer;margin-top:20px;}
.discord-btn:hover{background:#4752c4;}
</style>
</head>
<body>
<div class="container">
    <div class="account" id="account"><span id="accountName">Not logged in</span><span id="logoutBtn" class="logout-btn" style="display:none;" onclick="logout()">Logout</span></div>
    <div class="balance" id="balance">0</div>
    <div class="currency">ELC</div>
    <div class="coin-area"><div id="coin" class="coin gold"></div></div>
    <div class="bottom">
        <div class="energy" id="energy">⚡ 5000</div>
        <div class="buttons"><button onclick="openSkins()">Skins</button><button onclick="openUpgrades()">Upgrades</button></div>
    </div>
    <div id="loginPrompt" style="text-align:center;margin-top:20px;">
        <div class="discord-btn" onclick="loginWithDiscord()">Login with Discord</div>
    </div>
</div>

<div class="modal" id="skinsModal"><div class="modal-content"><h2>Skins</h2><div class="item" onclick="buySkin('silver',100)">Silver Coin — 100 ELC</div><div class="item" onclick="buySkin('black',1000)">Black Coin — 1000 ELC</div><button onclick="closeAll()">Close</button></div></div>
<div class="modal" id="upgradesModal"><div class="modal-content"><h2>Energy</h2><div class="item" onclick="buyEnergy(100,100)">+100 Energy — 100 ELC</div><div class="item" onclick="buyEnergy(500,500)">+500 Energy — 500 ELC</div><div class="item" onclick="buyEnergy(1000,1000)">+1000 Energy — 1000 ELC</div><h2>Regeneration</h2><div class="item" onclick="buyRegen(2,20)">2/sec — 20 ELC</div><div class="item" onclick="buyRegen(5,50)">5/sec — 50 ELC</div><div class="item" onclick="buyRegen(10,100)">10/sec — 100 ELC</div><button onclick="closeAll()">Close</button></div></div>

<script>
// Конфигурация OAuth2
const CLIENT_ID = '1514661552333131887';
const REDIRECT_URI = encodeURIComponent('https://elizzicoin.github.io/elc-clicker/');
const DISCORD_AUTH_URL = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;

// Состояние игры
let balance = 0;
let maxEnergy = 5000;
let regen = 1;
let energy = 5000;
let skin = "gold";
let discordId = null;
let discordUsername = null;

// DOM элементы
const coin = document.getElementById("coin");
const balanceEl = document.getElementById("balance");
const energyEl = document.getElementById("energy");
const accountNameEl = document.getElementById("accountName");
const logoutBtn = document.getElementById("logoutBtn");
const loginPrompt = document.getElementById("loginPrompt");

function getStorageKey() {
    return `elc_${discordId}`;
}

function loadGame() {
    if (!discordId) return;
    const saved = localStorage.getItem(getStorageKey());
    if (saved) {
        try {
            const data = JSON.parse(saved);
            balance = data.balance ?? 0;
            maxEnergy = data.maxEnergy ?? 5000;
            regen = data.regen ?? 1;
            energy = data.energy ?? maxEnergy;
            skin = data.skin ?? "gold";
        } catch(e) { resetGame(); }
    } else {
        resetGame();
    }
    coin.className = "coin " + skin;
    updateUI();
}

function resetGame() {
    balance = 0;
    maxEnergy = 5000;
    regen = 1;
    energy = 5000;
    skin = "gold";
    coin.className = "coin gold";
}

function saveGame() {
    if (!discordId) return;
    const data = { balance, maxEnergy, regen, energy, skin };
    localStorage.setItem(getStorageKey(), JSON.stringify(data));
    // Отладка: проверяем, что сохранилось
    console.log("Saved:", data);
}

function updateUI() {
    balanceEl.innerText = balance.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
    energyEl.innerText = "⚡ " + Math.floor(energy);
    accountNameEl.innerText = discordUsername ? discordUsername : "Not logged in";
}

// Клик по монете
coin.addEventListener("click", (e) => {
    if (!discordId) {
        alert("Please login with Discord first!");
        return;
    }
    if (energy <= 0) return;
    
    const clickValue = 0.01;
    energy--;
    balance += clickValue;
    
    // Анимация
    const rect = coin.getBoundingClientRect();
    const x = e.clientX - (rect.left + rect.width/2);
    const y = e.clientY - (rect.top + rect.height/2);
    coin.style.transform = `translate(${x/30}px,${y/30}px) scale(0.96)`;
    setTimeout(() => coin.style.transform = "", 80);
    
    const txt = document.createElement("div");
    txt.className = "floating";
    txt.innerText = "+" + clickValue;
    txt.style.left = e.clientX + "px";
    txt.style.top = e.clientY + "px";
    document.body.appendChild(txt);
    setTimeout(() => txt.remove(), 1000);
    
    updateUI();
    saveGame();
});

// Регенерация энергии
setInterval(() => {
    if (discordId) {
        energy = Math.min(maxEnergy, energy + regen);
        updateUI();
        saveGame();
    }
}, 1000);

// OAuth2 функции
function loginWithDiscord() {
    window.location.href = DISCORD_AUTH_URL;
}

function handleDiscordCallback() {
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = fragment.get('access_token');
    if (accessToken) {
        fetch('https://discord.com/api/users/@me', {
            headers: { Authorization: `Bearer ${accessToken}` }
        })
        .then(res => res.json())
        .then(user => {
            if (user.id) {
                discordId = user.id;
                discordUsername = user.username;
                // Сохраняем Discord ID в localStorage, чтобы при перезагрузке не терять
                localStorage.setItem('elc_discord_id', discordId);
                localStorage.setItem('elc_discord_name', discordUsername);
                loginPrompt.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                loadGame();
                updateUI();
                window.location.hash = '';
            }
        })
        .catch(err => {
            console.error(err);
            alert('Failed to get Discord user info');
        });
    } else {
        // Проверяем, есть ли сохранённый Discord ID
        const savedId = localStorage.getItem('elc_discord_id');
        const savedName = localStorage.getItem('elc_discord_name');
        if (savedId) {
            discordId = savedId;
            discordUsername = savedName;
            loginPrompt.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            loadGame();
            updateUI();
        }
    }
}

function logout() {
    discordId = null;
    discordUsername = null;
    localStorage.removeItem('elc_discord_id');
    localStorage.removeItem('elc_discord_name');
    loginPrompt.style.display = 'block';
    logoutBtn.style.display = 'none';
    resetGame();
    updateUI();
}

// Магазин
function openSkins() { skinsModal.style.display = "flex"; }
function openUpgrades() { upgradesModal.style.display = "flex"; }
function closeAll() { skinsModal.style.display = "none"; upgradesModal.style.display = "none"; }

function buySkin(type, cost) {
    if (!discordId) { alert("Login first"); return; }
    if (balance < cost) return;
    balance -= cost;
    skin = type;
    coin.className = "coin " + type;
    updateUI();
    saveGame();
}

function buyEnergy(add, cost) {
    if (!discordId) { alert("Login first"); return; }
    if (balance < cost) return;
    balance -= cost;
    maxEnergy += add;
    energy += add;
    updateUI();
    saveGame();
}

function buyRegen(amount, cost) {
    if (!discordId) { alert("Login first"); return; }
    if (balance < cost) return;
    balance -= cost;
    regen = amount;
    updateUI();
    saveGame();
}

// Запуск
handleDiscordCallback();
// Fullscreen при клике в любом месте
document.body.addEventListener('click', function() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { // Safari
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { // IE/Edge
        elem.msRequestFullscreen();
    }
});
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </html>
